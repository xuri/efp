name: Go
on: [push, pull_request]
jobs:

  test:
    strategy:
      matrix:
        go-version: [1.12.x, 1.13.x, 1.14.x, 1.15.x, 1.16.x, 1.17.x, 1.18.x, 1.19.x, 1.20.x, 1.21.x, 1.22.x, 1.23.x, 1.24.x, 1.25.x, 1.26.x, 1.27.x]
        os: [ubuntu-26.04, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        cache: false
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v7

    - name: Get dependencies
      run: |
        go get -v -t -d ./...

    - name: Build
      run: go build -v .

    - name: Test
      run: go test -v -race -coverprofile='coverage.txt' -covermode=atomic ./...

    - name: Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        files: coverage.txt
        flags: unittests
        name: codecov-umbrella
